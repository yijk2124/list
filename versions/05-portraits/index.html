<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>星穹塔防</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; color: #e8e6f5; user-select: none;
         font-family: -apple-system, "PingFang SC", sans-serif;
         background: radial-gradient(ellipse at top, #241c55 0%, #0a0b1d 60%, #05060d 100%);
         display: flex; flex-direction: column; align-items: center; }
  h1 { margin: 10px 0 6px; font-size: 24px; letter-spacing: 8px; font-weight: 600; font-family: "Songti SC", "STSong", serif;
       background: linear-gradient(90deg, #fff4d6, #d9b46c, #fff4d6); -webkit-background-clip: text; background-clip: text; color: transparent; }
  #hud { display: flex; gap: 10px; margin-bottom: 8px; font-size: 14px; }
  .chip { padding: 4px 16px; border: 1px solid rgba(217,180,108,.45); background: rgba(12,16,42,.7);
          clip-path: polygon(8px 0, 100% 0, calc(100% - 8px) 100%, 0 100%); }
  .chip b { color: #ffd27a; margin-left: 4px; }
  #wrap { display: flex; gap: 12px; }
  canvas#c { border: 1px solid rgba(217,180,108,.5); box-shadow: 0 0 50px rgba(110,120,255,.28); cursor: crosshair; }
  #panel { width: 240px; display: flex; flex-direction: column; gap: 5px; }
  .sec { font-size: 11px; letter-spacing: 3px; color: #d9b46c; border-bottom: 1px solid rgba(217,180,108,.3); padding-bottom: 2px; }
  #towers { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
  .tower-btn { display: flex; gap: 6px; align-items: center; color: #e8e6f5; cursor: pointer; font-size: 12px; text-align: left; padding: 4px 6px;
               background: linear-gradient(135deg, rgba(32,38,78,.95), rgba(14,17,40,.95)); border: 1px solid rgba(217,180,108,.22);
               clip-path: polygon(0 0, calc(100% - 8px) 0, 100% 8px, 100% 100%, 8px 100%, 0 calc(100% - 8px)); }
  .tower-btn canvas { flex: none; border-radius: 50%; }
  .ult canvas { border-radius: 50%; }
  #info canvas { display: block; width: 100%; height: 72px; margin-bottom: 4px; }
  .tower-btn small { display: block; color: #a9a8c8; font-size: 10.5px; white-space: nowrap; }
  .tower-btn i { font-style: normal; }
  .tower-btn.sel { border-color: #ffd27a; background: linear-gradient(135deg, rgba(78,64,38,.95), rgba(26,22,42,.95)); }
  .tower-btn:disabled { opacity: .4; cursor: not-allowed; }
  #ults { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
  .ult { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px 1px; cursor: pointer; color: #bbb9d8; font-size: 10px;
         white-space: nowrap; overflow: hidden; background: rgba(12,16,42,.8); border: 1px solid rgba(217,180,108,.22); }
  .ult canvas { filter: grayscale(.85) brightness(.5); }
  .ult.ready { border-color: #ffd27a; color: #ffe6a8; animation: pulse .9s infinite alternate; }
  .ult.ready canvas { filter: none; }
  .ult:disabled { cursor: not-allowed; }
  .ult .bar { width: 88%; height: 3px; background: rgba(255,255,255,.1); }
  .ult .bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #7fe3ff, #ffd27a); }
  @keyframes pulse { from { box-shadow: 0 0 4px #ffd27a; } to { box-shadow: 0 0 14px #ffd27a; } }
  button.act { border: 1px solid rgba(217,180,108,.5); color: #fff; padding: 7px; font-size: 13px; cursor: pointer;
               background: linear-gradient(180deg, #2f3a7a, #1b2150); }
  button.act:disabled { opacity: .45; cursor: not-allowed; }
  button.act.alt { flex: 1; background: linear-gradient(180deg, #2a2f4f, #181b33); }
  .row { display: flex; gap: 5px; }
  #info { background: rgba(12,16,42,.75); border: 1px solid rgba(217,180,108,.2); padding: 6px 8px; font-size: 12px; line-height: 1.5; min-height: 92px; }
  #info button { margin: 4px 4px 0 0; padding: 3px 8px; border: 1px solid #d9b46c; background: #1b2150; color: #fff; cursor: pointer; font-size: 12px; }
  #info button:disabled { opacity: .45; }
  .dim { color: #a9a8c8; }
  .help { font-size: 10.5px; color: #8f8db0; line-height: 1.45; }
</style>
</head>
<body>
<h1>✦ 星穹塔防 ✦</h1>
<div id="hud">
  <span class="chip">生命<b id="lives">20</b></span>
  <span class="chip">信用点<b id="gold">0</b></span>
  <span class="chip">波次<b id="wave">0</b></span>
  <span class="chip">分数<b id="score">0</b></span>
</div>
<div id="wrap">
  <canvas id="c" aria-label="游戏地图"></canvas>
  <div id="panel">
    <div class="sec">命途部署</div>
    <div id="towers"></div>
    <div class="sec">终结技</div>
    <div id="ults"></div>
    <button class="act" id="startBtn">▶ 开始下一波</button>
    <div class="row"><button class="act alt" id="speedBtn">⏩ x1</button><button class="act alt" id="pauseBtn">⏸ 暂停</button></div>
    <div id="info"></div>
    <div class="help">1–8 部署 · Q W E R T Y U I 终结技 · 空格 下一波 · P 暂停<br>敌人头顶的菱形是弱点属性。同属性攻击会削减韧性（白条），削空触发「击破」：眩晕并附加属性效果。裂空无视弱点削韧。</div>
  </div>
</div>
<script src="js/core.js"></script>
<script src="js/portrait.js"></script>
<script src="js/game.js"></script>
<script src="js/draw.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
